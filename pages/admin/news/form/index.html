<main class="form-wrapper">
    <div class="form-container">
        <header class="flex-row align-center">
            <a href="#/admin/news">
                <i class="fa-solid fa-arrow-left"></i>
            </a>
            <h1 class="heading" id="formTitle">Criar Notícia</h1>
        </header>

        <p id="errorMessage" class="text-small" style="color: red; text-align: center; margin-block: 1rem; display: none;"></p>

        <form id="newsForm" class="content-wrapper-size flex-column flex-center">
            <input type="hidden" id="newsId" name="id">
            
            <div class="form-group">
                <label for="name">Nome</label>
                <input type="text" name="name" id="name" placeholder="Insira o nome da notícia" required>
            </div>

            <div class="form-group">
                <label for="description">Descrição</label>
                <textarea name="description" id="description" placeholder="Insira a descrição da notícia" required></textarea>
            </div>

            <div class="form-group">
                <label for="imageSrc">URL da imagem</label>
                <input type="text" name="imageSrc" id="imageSrc" placeholder="Insira a URL da imagem" required>
            </div>

            <button type="submit" class="btn-primary">Salvar</button>
        </form>
    </div>
</main>
