<main class="form-wrapper">
    <div class="form-container">
        <header class="flex-row align-center">
            <a href="#/admin/users">
                <i class="fa-solid fa-arrow-left"></i>
            </a>
            <h1 class="heading" id="formTitle">Criar Admin</h1>
        </header>

        <p id="errorMessage" class="text-small" style="color: red; text-align: center; margin-block: 1rem; display: none;"></p>

        <form id="userForm" class="content-wrapper-size flex-column flex-center">
            <input type="hidden" id="userId" name="id">
            
            <div class="form-group">
                <label for="name">Nome</label>
                <input type="text" name="name" id="name" placeholder="Insira o nome do usuário" required>
            </div>

            <div class="form-group">
                <label for="email">E-mail</label>
                <input type="email" name="email" id="email" placeholder="Insira o e-mail" required>
            </div>

            <div class="form-group">
                <label for="password">Senha</label>
                <input type="password" name="password" id="password" placeholder="Insira a senha" required minlength="8">
            </div>
            
            <div class="form-group">
                <label for="password-confirmation">Confirmação de senha</label>
                <input type="password" name="password-confirmation" id="password-confirmation" placeholder="Confirme a senha" required minlength="8">
            </div>

            <button type="submit" class="btn-primary">Salvar</button>
        </form>
    </div>
</main>
