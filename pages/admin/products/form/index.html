<main class="form-wrapper">
    <div class="form-container">
        <header class="flex-row align-center">
            <a href="#/admin/products">
                <i class="fa-solid fa-arrow-left"></i>
            </a>
            <h1 class="heading" id="formTitle">Criar Produto</h1>
        </header>

        <p id="errorMessage" class="text-small" style="color: red; text-align: center; margin-block: 1rem; display: none;"></p>

        <form id="productForm" class="content-wrapper-size flex-column flex-center">
            <input type="hidden" id="productId" name="id">
            
            <div class="form-group">
                <label for="name">Nome</label>
                <input type="text" name="name" id="name" placeholder="Insira o nome do produto" required>
            </div>

            <div class="form-group">
                <label for="description">Descrição</label>
                <input type="text" name="description" id="description" placeholder="Insira a descrição" required>
            </div>
            
            <div class="form-group">
                <label for="price">Preço</label>
                <input type="number" name="price" id="price" placeholder="Insira o preço do produto" required step="0.01" min="0">
            </div>
            
            <div class="form-group">
                <label for="imageSrc">URL da imagem</label>
                <input type="text" name="imageSrc" id="imageSrc" placeholder="Insira a URL da imagem" required>
            </div>

            <button type="submit" class="btn-primary">Salvar</button>
        </form>
    </div>
</main>
